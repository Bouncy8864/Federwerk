<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Federwerk – Autoren-Werkzeug</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#9a6a3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Federwerk">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
  :root{
    --bg:#f6f3ec;
    --panel:#fffdf9;
    --panel-2:#f0ebe0;
    --ink:#2b2620;
    --ink-soft:#6b6155;
    --line:#e2d9c9;
    --accent:#9a6a3c;
    --accent-soft:#c9a878;
    --accent-bg:#f3e7d6;
    --danger:#a4443a;
    --ok:#5c7a4a;
    --shadow:0 1px 3px rgba(60,45,25,.08),0 6px 20px rgba(60,45,25,.06);
    --radius:10px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#20201d; --panel:#2a2926; --panel-2:#333230;
    --ink:#eae5da; --ink-soft:#a49c8e; --line:#403e39;
    --accent:#d3a76d; --accent-soft:#8a6c47; --accent-bg:#3a332a;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
       height:100vh;overflow:hidden;font-size:15px;line-height:1.5}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:inherit;color:var(--ink)}

  /* Layout */
  .app{display:grid;grid-template-columns:230px 1fr;height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;
           flex-direction:column;overflow:hidden}
  .brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-family:var(--serif);font-size:21px;letter-spacing:.3px}
  .brand .sub{color:var(--ink-soft);font-size:12px;margin-top:2px}
  .proj-pick{padding:10px 12px;border-bottom:1px solid var(--line)}
  .proj-pick select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;
                    background:var(--panel-2)}
  .nav{flex:1;overflow-y:auto;padding:8px}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
              padding:9px 12px;margin:2px 0;border:0;border-radius:8px;background:transparent;
              color:var(--ink);font-weight:500}
  .nav button:hover{background:var(--panel-2)}
  .nav button.active{background:var(--accent-bg);color:var(--accent)}
  .nav .ico{width:18px;text-align:center;font-size:16px}
  .nav .count{margin-left:auto;font-size:12px;color:var(--ink-soft);background:var(--panel-2);
              padding:1px 7px;border-radius:20px}
  .nav button.active .count{background:var(--panel)}
  .side-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
  .side-foot button{flex:1;padding:7px;border:1px solid var(--line);border-radius:8px;
                    background:var(--panel-2);color:var(--ink-soft);font-size:12px}
  .side-foot button:hover{color:var(--accent);border-color:var(--accent-soft)}

  .main{overflow-y:auto;position:relative}
  .view{padding:26px 34px;max-width:1100px;margin:0 auto}
  .view h2{font-family:var(--serif);font-size:26px;margin:0 0 4px}
  .view .lead{color:var(--ink-soft);margin:0 0 22px;max-width:640px}

  /* Buttons */
  .btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
       color:var(--ink);font-weight:500}
  .btn:hover{border-color:var(--accent-soft)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
  .btn.danger{color:var(--danger);border-color:transparent}
  .btn.danger:hover{background:rgba(164,68,58,.1)}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .spacer{flex:1}

  /* Cards */
  .grid{display:grid;gap:14px}
  .grid.cols{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 6px;font-family:var(--serif);font-size:18px}
  .card .meta{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
  .card p{margin:8px 0 0;color:var(--ink-soft);font-size:14px}
  .entity-card{cursor:pointer;transition:border-color .12s,transform .12s}
  .entity-card:hover{border-color:var(--accent-soft);transform:translateY(-1px)}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-bg);color:var(--accent);
          display:flex;align-items:center;justify-content:center;font-family:var(--serif);
          font-size:20px;font-weight:600;flex-shrink:0}
  .avatar.sq{border-radius:10px}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;background:var(--panel-2);
       font-size:12px;color:var(--ink-soft);margin:2px 4px 2px 0}
  .tag.role{background:var(--accent-bg);color:var(--accent)}

  /* Fields */
  label.f{display:block;margin:12px 0 0}
  label.f .lbl{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;
               text-transform:uppercase;letter-spacing:.5px}
  .in,textarea.in,select.in{width:100%;padding:9px 11px;border:1px solid var(--line);
       border-radius:8px;background:var(--panel);color:var(--ink)}
  textarea.in{resize:vertical;min-height:70px;line-height:1.55}
  .in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--accent-soft);
       box-shadow:0 0 0 3px var(--accent-bg)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  /* Empty */
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
  .empty .big{font-size:44px;margin-bottom:10px;opacity:.6}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(30,24,14,.45);display:flex;
           align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;
           overflow-y:auto}
  .modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:100%;
         max-width:640px;padding:24px 26px;border:1px solid var(--line)}
  .modal.wide{max-width:860px}
  .modal h3{margin:0 0 2px;font-family:var(--serif);font-size:22px}
  .modal .foot{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

  /* Manuscript */
  .ms{display:grid;grid-template-columns:260px 1fr;gap:0;height:calc(100vh);}
  .binder{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 10px}
  .binder h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
             margin:6px 8px;display:flex;align-items:center}
  .chapter{margin-bottom:6px}
  .chapter-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;font-weight:600}
  .chapter-h:hover{background:var(--panel-2)}
  .chapter-h .ttl{flex:1;cursor:pointer}
  .scene-item{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 22px;border-radius:7px;
              cursor:pointer;color:var(--ink-soft);font-size:14px}
  .scene-item:hover{background:var(--panel-2)}
  .scene-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
  .scene-item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-soft);flex-shrink:0}
  .scene-item .dot.draft{background:#c9a878}
  .scene-item .dot.done{background:var(--ok)}
  .scene-item .dot.todo{background:var(--line)}
  .scene-item .grip,.chapter-h .grip{cursor:grab;color:var(--ink-soft);opacity:.4;font-size:12px;
       user-select:none;flex-shrink:0}
  .scene-item:hover .grip,.chapter-h:hover .grip{opacity:.8}
  .scene-item.dragging,.chapter.dragging{opacity:.4}
  .drop-before{box-shadow:inset 0 2px 0 var(--accent)}
  .drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
  .chapter.drop-into{background:var(--accent-bg);border-radius:8px}
  .editor-wrap{overflow-y:auto;display:flex;flex-direction:column}
  .editor-bar{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
              padding:10px 22px;display:flex;align-items:center;gap:12px;z-index:5;flex-wrap:wrap}
  .editor-bar input.title{border:0;background:transparent;font-family:var(--serif);font-size:20px;
                           font-weight:600;flex:1;min-width:140px}
  .editor-bar input.title:focus{outline:none}
  .editor-body{padding:20px 22px 80px;max-width:760px;width:100%;margin:0 auto;flex:1}
  .editor-body textarea{width:100%;border:0;background:transparent;font-family:var(--serif);
       font-size:18px;line-height:1.75;min-height:55vh;resize:none;color:var(--ink)}
  .editor-body textarea:focus{outline:none}
  .scene-summary{width:100%;border:1px dashed var(--line);border-radius:8px;padding:9px 11px;
       background:var(--panel-2);font-size:13px;margin-bottom:16px;color:var(--ink-soft)}
  .detected{padding:8px 22px;border-top:1px solid var(--line);background:var(--panel);
            font-size:13px;color:var(--ink-soft)}
  .detected .chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-bg);
        color:var(--accent);padding:2px 10px;border-radius:20px;margin:2px 4px 2px 0;font-size:12px}

  .pill{padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);
        background:var(--panel);color:var(--ink-soft)}
  .status-sel{padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);
              font-size:12px}

  /* Relationship graph */
  .graph-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
              box-shadow:var(--shadow);overflow:hidden}
  svg.graph{width:100%;display:block;background:
     radial-gradient(circle at 50% 40%, var(--panel), var(--panel))}
  .node circle{fill:var(--accent-bg);stroke:var(--accent-soft);stroke-width:1.5;cursor:pointer}
  .node text{font-family:var(--sans);font-size:12px;fill:var(--ink);pointer-events:none}
  .edge{stroke:var(--accent-soft);stroke-width:2;opacity:.65;transition:opacity .15s}
  .edge-label{font-size:10px;fill:var(--ink-soft)}
  .arrow{transition:opacity .15s}
  .node circle{transition:opacity .15s,stroke-width .12s}
  .node text{transition:opacity .15s}
  .graph.focused .edge,.graph.focused .arrow,.graph.focused .edge-label,
  .graph.focused .node{opacity:.15}
  .graph.focused .edge.hi,.graph.focused .arrow.hi,.graph.focused .edge-label.hi,
  .graph.focused .node.hi{opacity:1}
  .graph.focused .node.hi circle{stroke-width:3}
  .legend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
  .legend .li{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .legend .sw{width:14px;height:4px;border-radius:2px;display:inline-block}
  .rel-cat{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
  .suggest{background:var(--accent-bg);border:1px solid var(--accent-soft);border-radius:10px;
       padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .suggest .txt{flex:1;font-size:14px}

  /* Lernen */
  .lesson{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
       margin-bottom:10px;box-shadow:var(--shadow)}
  .lesson-h{display:flex;align-items:center;gap:12px;cursor:pointer}
  .lesson-h .ico{font-size:22px;width:30px;text-align:center}
  .lesson-h .t{flex:1;font-family:var(--serif);font-size:18px;font-weight:600}
  .lesson-h .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
       display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .lesson-h .chk.on{background:var(--ok);border-color:var(--ok)}
  .lesson-body{margin-top:12px;line-height:1.7}
  .lesson-body p{margin:0 0 10px}
  .lesson-ex{background:var(--accent-bg);border:1px solid var(--accent-soft);border-radius:8px;
       padding:12px 14px;margin-top:6px}
  .lesson-ex .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:600}
  .learn-progress{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;
       margin-bottom:18px;box-shadow:var(--shadow)}
  .warmup{background:var(--accent-bg);border:1px solid var(--accent-soft);border-radius:10px;
       padding:16px 18px;margin-bottom:18px}
  .warmup .q{font-family:var(--serif);font-size:18px;margin-bottom:10px}

  /* Wizard */
  .wiz-steps{display:flex;gap:6px;margin-bottom:18px}
  .wiz-steps .s{flex:1;height:5px;border-radius:3px;background:var(--panel-2)}
  .wiz-steps .s.on{background:var(--accent)}
  .wiz-q{font-family:var(--serif);font-size:20px;margin-bottom:4px}
  .wiz-hint{color:var(--ink-soft);font-size:14px;margin-bottom:12px}
  .choice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);
       border-radius:9px;background:var(--panel);margin-bottom:8px;color:var(--ink)}
  .choice:hover{border-color:var(--accent-soft);background:var(--panel-2)}
  .choice.sel{border-color:var(--accent);background:var(--accent-bg)}

  /* KI-Assistent */
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 0px)}
  .chat-scroll{flex:1;overflow-y:auto;padding:20px 0}
  .msg{max-width:660px;margin:0 auto 14px;display:flex;gap:10px}
  .msg .who{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
       justify-content:center;font-size:15px}
  .msg.user .who{background:var(--panel-2)}
  .msg.assistant .who{background:var(--accent-bg)}
  .msg .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px;
       line-height:1.6;white-space:pre-wrap;flex:1;box-shadow:var(--shadow)}
  .msg.user .bubble{background:var(--panel-2);border-color:transparent}
  .chat-input{border-top:1px solid var(--line);padding:12px 0;background:var(--bg)}
  .chat-input .inner{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .chat-input textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
       resize:none;min-height:44px;max-height:160px;background:var(--panel);color:var(--ink);font-size:15px}
  .quick-row{max-width:680px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px}
  .quick{padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
       font-size:13px;color:var(--ink-soft)}
  .quick:hover{border-color:var(--accent-soft);color:var(--accent)}
  .typing{color:var(--ink-soft);font-style:italic}

  /* Timeline */
  .tl{position:relative;margin-left:6px;padding-left:26px}
  .tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-chapter{font-family:var(--serif);font-size:15px;color:var(--ink-soft);text-transform:uppercase;
       letter-spacing:.6px;margin:22px 0 10px;position:relative}
  .tl-node{position:relative;margin:0 0 12px}
  .tl-node:before{content:"";position:absolute;left:-24px;top:16px;width:12px;height:12px;border-radius:50%;
       background:var(--panel);border:2px solid var(--accent-soft)}
  .tl-node.done:before{background:var(--ok);border-color:var(--ok)}
  .tl-node.draft:before{background:var(--accent-soft)}
  .tl-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
       box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s}
  .tl-card:hover{border-color:var(--accent-soft)}
  .tl-when{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-bg);
       padding:1px 9px;border-radius:20px;margin-bottom:4px}
  .tl-title{font-family:var(--serif);font-size:17px;font-weight:600}
  .tl-sum{color:var(--ink-soft);font-size:14px;margin-top:3px}
  .tl-meta{margin-top:7px;font-size:12px;color:var(--ink-soft)}

  /* Threads / Handlungsstränge */
  .thread-bar{width:4px;align-self:stretch;border-radius:3px;flex-shrink:0;margin-right:2px}
  .thread-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
       font-size:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink-soft)}
  .thread-chip.active{border-color:var(--accent-soft);color:var(--ink);font-weight:500}
  .thread-chip .d{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .tl-card{border-left-width:4px;border-left-style:solid}

  /* Search */
  .search-box{padding:8px 12px;border-bottom:1px solid var(--line)}
  .search-box input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
       background:var(--panel-2)}
  .result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
       margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
  .result:hover{border-color:var(--accent-soft)}
  .result .rk{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
  .result mark{background:var(--accent-bg);color:var(--accent);padding:0 2px;border-radius:3px}

  /* Ring (Schreibziel) */
  .ring-wrap{display:flex;align-items:center;gap:14px}
  .ring{--p:0;width:74px;height:74px;border-radius:50%;flex-shrink:0;
     background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--panel-2) 0);
     display:flex;align-items:center;justify-content:center}
  .ring i{width:56px;height:56px;border-radius:50%;background:var(--panel);display:flex;
     align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:17px;font-style:normal}

  /* Dashboard stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
        box-shadow:var(--shadow)}
  .stat .n{font-family:var(--serif);font-size:30px;line-height:1}
  .stat .l{color:var(--ink-soft);font-size:13px;margin-top:4px}
  .progressbar{height:8px;background:var(--panel-2);border-radius:20px;overflow:hidden;margin-top:8px}
  .progressbar i{display:block;height:100%;background:var(--accent)}

  /* Ideas */
  .idea{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .idea .txt{flex:1}
  .idea.done .txt{text-decoration:line-through;color:var(--ink-soft)}
  .prompt-box{background:var(--accent-bg);border:1px solid var(--accent-soft);border-radius:10px;
              padding:16px 18px;margin-bottom:20px}
  .prompt-box .q{font-family:var(--serif);font-size:17px;margin-bottom:8px}

  .beat{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .beat:last-child{border-bottom:0}
  .beat .num{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);
             display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
  .beat .bt{font-weight:600}
  .beat .bd{color:var(--ink-soft);font-size:14px}

  .link-list a,.link-list span.lk{color:var(--accent);cursor:pointer;text-decoration:none}
  .link-list a:hover{text-decoration:underline}
  .divider{height:1px;background:var(--line);margin:20px 0}
  .muted{color:var(--ink-soft)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);
         color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:100;
         opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.95}
  .rel-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .rel-item:last-child{border-bottom:0}
  /* Mobile Kopfleiste + Menü-Schublade (nur auf schmalen Bildschirmen sichtbar) */
  .mbar{display:none}
  .scrim{display:none}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .mbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;height:52px;
      background:var(--panel);border-bottom:1px solid var(--line);z-index:80;padding:0 8px;
      padding-top:env(safe-area-inset-top)}
    .mbar .ham{font-size:24px;line-height:1;background:none;border:0;color:var(--ink);
      padding:6px 12px;border-radius:8px;cursor:pointer}
    .mbar .ham:active{background:var(--panel-2)}
    .mbar .ttl{font-family:var(--serif);font-size:19px;font-weight:600}
    .main{padding-top:52px}
    .sidebar{display:flex;position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;z-index:90;
      transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 30px rgba(0,0,0,.3)}
    .sidebar.open{transform:none}
    .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85;opacity:0;
      pointer-events:none;transition:opacity .2s}
    .scrim.open{opacity:1;pointer-events:auto}
    /* Manuskript & Chat: Höhe um die Kopfleiste kürzen */
    .ms{grid-template-columns:1fr;height:calc(100vh - 52px)}
    .chat-wrap{height:calc(100vh - 52px)}
    /* Kapitel-Liste gestapelt über dem Editor statt versteckt */
    .binder{max-height:34vh;overflow-y:auto;border-right:0;border-bottom:1px solid var(--line)}
    .editor-body textarea{min-height:40vh}
    /* Sticky-Unterleisten unter die Kopfleiste schieben */
    .editor-bar{top:0}
    .search-box{position:sticky;top:0}
  }
</style>
</head>
<body>
<header class="mbar">
  <button class="ham" id="menuBtn" aria-label="Menü öffnen">☰</button>
  <span class="ttl">Federwerk</span>
</header>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Federwerk</h1>
      <div class="sub">Dein Werkzeug für Geschichten &amp; Welten</div>
    </div>
    <div class="proj-pick">
      <select id="projectSelect" class="in"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button id="btnNewProject">＋ Projekt</button>
      <button id="btnExport">Sichern</button>
      <button id="btnImport">Laden</button>
      <button id="btnTheme">◐ Thema</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
"use strict";
/* ============================================================
   Federwerk – einfaches Autoren-Werkzeug (eine Datei, offline)
   Speicherung: localStorage. Kein Server, keine Cloud.
   ============================================================ */

const STORE_KEY = "federwerk.v1";
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);

/* ---------- Datenmodell ---------- */
function newProject(title){
  const pid = uid();
  return {
    id: pid,
    meta:{ title: title||"Neues Projekt", genre:"", logline:"", premise:"", created:Date.now(), dailyGoal:0 },
    chapters:[],
    threads:[],
    stats:{daily:{}},
    characters:[],
    places:[],
    elements:[],
    relationships:[],
    ideas:[],
    notes:""
  };
}

let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.projects) return d; }
  }catch(e){}
  const p = newProject("Meine erste Geschichte");
  // Ein paar Ideen-Anregungen als Start
  p.ideas = [
    {id:uid(), text:"Was ist die eine Frage, die meine Geschichte beantworten will?", done:false},
    {id:uid(), text:"Wer verändert sich am meisten – und wodurch?", done:false}
  ];
  return { projects:{[p.id]:p}, current:p.id };
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){ toast("Speichern fehlgeschlagen (Speicher voll?)"); } }
function proj(){ return DB.projects[DB.current]; }

/* ---------- Hilfen ---------- */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1800);
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function initials(name){
  const p=(name||"?").trim().split(/\s+/);
  return ((p[0]?.[0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase()||"?";
}
function wordCount(s){ const m=(s||"").trim().match(/\S+/g); return m?m.length:0; }
function projWordCount(){
  return proj().chapters.reduce((a,c)=>a+c.scenes.reduce((b,s)=>b+wordCount(s.text),0),0);
}
function findEntity(id){
  const p=proj();
  return p.characters.find(x=>x.id===id)||p.places.find(x=>x.id===id)||p.elements.find(x=>x.id===id);
}
function entityKind(id){
  const p=proj();
  if(p.characters.some(x=>x.id===id))return"character";
  if(p.places.some(x=>x.id===id))return"place";
  if(p.elements.some(x=>x.id===id))return"element";
  return null;
}

/* ---------- Beziehungs-Kategorien ---------- */
const REL_CATEGORIES = [
  {id:"family",   label:"Familie",            color:"#8a6c47"},
  {id:"love",     label:"Liebe / Romanze",    color:"#c0566b"},
  {id:"friend",   label:"Freundschaft",       color:"#5c7a4a"},
  {id:"conflict", label:"Konflikt / Feind",   color:"#a4443a"},
  {id:"ally",     label:"Bündnis / Beruf",    color:"#3f6f8f"},
  {id:"place",    label:"Ort / Zugehörigkeit",color:"#b58a3c"},
  {id:"other",    label:"Sonstiges",          color:"#8b8378"},
];
function catOf(id){ return REL_CATEGORIES.find(c=>c.id===id)||REL_CATEGORIES[6]; }

/* Stärke & Tonalität einer Beziehung */
const REL_STRENGTHS = [{v:1,label:"lose"},{v:2,label:"mittel"},{v:3,label:"eng"}];
const STRENGTH_WIDTH = {1:1.5, 2:3, 3:5};
const REL_TENSIONS = [
  {id:"warm",   label:"Harmonisch",     icon:"💚"},
  {id:"neutral",label:"Neutral",        icon:"",  },
  {id:"cold",   label:"Konfliktreich",  icon:"⚡"},
];
function tensionOf(id){ return REL_TENSIONS.find(t=>t.id===id)||REL_TENSIONS[1]; }
function chapterIndexOf(chId){ return proj().chapters.findIndex(c=>c.id===chId); }
// Effektiver Zustand einer Beziehung zu einem Handlungszeitpunkt (null = Aktuell/Gesamt)
function effectiveRel(r, uptoIdx){
  const base={label:r.label||"", strength:r.strength||2, tension:r.tension||"neutral", visible:true};
  if(uptoIdx===null) return base;
  // "besteht ab" – vor diesem Kapitel existiert die Beziehung noch nicht
  if(r.startCh){ const si=chapterIndexOf(r.startCh); if(si>=0 && si>uptoIdx) return {visible:false}; }
  const stages=(r.stages||[]).filter(s=>s.ch && chapterIndexOf(s.ch)>=0)
    .sort((a,b)=>chapterIndexOf(a.ch)-chapterIndexOf(b.ch));
  const applicable=stages.filter(s=>chapterIndexOf(s.ch)<=uptoIdx);
  if(!applicable.length) return base; // Grundform gilt von Beginn an
  const cur=applicable[applicable.length-1];
  return { label:cur.label||base.label, strength:cur.strength||base.strength,
           tension:cur.tension||base.tension, visible:true, stageNote:cur.note||"" };
}
function graphPos(){ const p=proj(); if(!p.graphPos) p.graphPos={}; return p.graphPos; }

/* ---------- Handlungsstränge (Farb-Etiketten) ---------- */
const THREAD_COLORS = ["#c0566b","#3f6f8f","#5c7a4a","#b58a3c","#7a5c9e","#c77d3c","#4aa0a0","#a4443a"];
function threads(){ const p=proj(); if(!p.threads) p.threads=[]; return p.threads; }
function threadById(id){ return threads().find(t=>t.id===id)||null; }

/* ---------- Tages-Schreibziel ---------- */
function todayKey(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ensureDaily(){ const p=proj(); if(!p.stats) p.stats={daily:{}};
  const k=todayKey(); if(p.stats.daily[k]===undefined){ p.stats.daily[k]=projWordCount(); save(); } }
function wordsToday(){ const p=proj(); if(!p.stats) return 0;
  const s=p.stats.daily[todayKey()]; return s===undefined?0:Math.max(0, projWordCount()-s); }

/* ---------- Automatische Erkennung von Namen im Text ---------- */
function namesFor(entity){
  const list = [entity.name, ...((entity.aliases||"").split(",").map(s=>s.trim()).filter(Boolean))];
  return list.filter(n=>n && n.length>=2);
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function detectInText(text){
  const p=proj(); const t=text||"";
  const hitChars=[], hitPlaces=[];
  for(const c of p.characters){
    if(namesFor(c).some(n=>new RegExp("(^|[^\\wäöüß])"+escRe(n)+"([^\\wäöüß]|$)","i").test(t))) hitChars.push(c);
  }
  for(const pl of p.places){
    if(namesFor(pl).some(n=>new RegExp("(^|[^\\wäöüß])"+escRe(n)+"([^\\wäöüß]|$)","i").test(t))) hitPlaces.push(pl);
  }
  return {characters:hitChars, places:hitPlaces};
}
// In welchen Szenen kommt eine Entität vor?
function scenesWith(entityId){
  const p=proj(); const ent=findEntity(entityId); if(!ent) return [];
  const out=[];
  for(const ch of p.chapters) for(const sc of ch.scenes){
    const det = detectInText(sc.text);
    if(det.characters.some(x=>x.id===entityId)||det.places.some(x=>x.id===entityId))
      out.push({chapter:ch, scene:sc});
  }
  return out;
}

/* ============================================================
   Navigation & Rendering
   ============================================================ */
let VIEW = "dashboard";
let EDIT_SCENE = null; // {chapterId, sceneId}

const NAV = [
  {id:"dashboard", ico:"🏠", label:"Übersicht"},
  {id:"manuscript", ico:"📖", label:"Manuskript", count:()=>proj().chapters.reduce((a,c)=>a+c.scenes.length,0)},
  {id:"characters", ico:"👤", label:"Figuren", count:()=>proj().characters.length},
  {id:"places", ico:"🗺️", label:"Orte", count:()=>proj().places.length},
  {id:"elements", ico:"✦", label:"Weltelemente", count:()=>proj().elements.length},
  {id:"relations", ico:"🔗", label:"Beziehungen", count:()=>proj().relationships.length},
  {id:"timeline", ico:"📅", label:"Zeitstrahl", count:()=>proj().chapters.reduce((a,c)=>a+c.scenes.length,0)},
  {id:"ideas", ico:"💡", label:"Ideen & Struktur", count:()=>proj().ideas.filter(i=>!i.done).length},
  {id:"learn", ico:"🎓", label:"Schreiben lernen"},
  {id:"assistant", ico:"✨", label:"KI-Assistent"},
  {id:"notes", ico:"🗒️", label:"Notizen"},
];
function learnState(){ if(!DB.learn) DB.learn={done:{}}; return DB.learn; }
function aiState(){ if(!DB.ai) DB.ai={key:"", model:"claude-opus-4-8"}; return DB.ai; }

function renderNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML = NAV.map(n=>{
    const c = n.count ? `<span class="count">${n.count()}</span>`:"";
    return `<button data-view="${n.id}" class="${VIEW===n.id?'active':''}">
      <span class="ico">${n.ico}</span><span>${n.label}</span>${c}</button>`;
  }).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.view));

  const sel=document.getElementById("projectSelect");
  sel.innerHTML = Object.values(DB.projects)
    .map(p=>`<option value="${p.id}" ${p.id===DB.current?"selected":""}>${esc(p.meta.title)}</option>`).join("");
  sel.onchange = ()=>{ DB.current=sel.value; save(); go("dashboard"); };
}
function go(view){ VIEW=view; closeMenu(); render(); }
function toggleMenu(open){
  const sb=document.querySelector(".sidebar"), sc=document.getElementById("scrim");
  if(!sb||!sc) return;
  const o = open===undefined ? !sb.classList.contains("open") : open;
  sb.classList.toggle("open", o); sc.classList.toggle("open", o);
}
function closeMenu(){ toggleMenu(false); }
function render(){ ensureDaily(); renderNav(); renderSearchBox(); document.getElementById("main").innerHTML=""; (VIEWS[VIEW]||VIEWS.dashboard)(); }

/* ---------- Globale Suche ---------- */
let SEARCH_Q = "";
function renderSearchBox(){
  let box=document.getElementById("searchBox");
  if(!box){
    box=document.createElement("div"); box.className="search-box"; box.id="searchBox";
    box.innerHTML=`<input id="searchInput" type="search" placeholder="🔍 Alles durchsuchen…">`;
    const pick=document.querySelector(".proj-pick"); pick.after(box);
    box.querySelector("#searchInput").addEventListener("input", debounce(e=>{
      SEARCH_Q=e.target.value; if(SEARCH_Q.trim()){ if(VIEW!=="search") VIEW="search"; renderSearchResults(); }
      else if(VIEW==="search"){ VIEW="dashboard"; render(); }
    },250));
    box.querySelector("#searchInput").addEventListener("keydown",e=>{ if(e.key==="Enter" && SEARCH_Q.trim()){ VIEW="search"; render(); } });
  }
}
function searchAll(q){
  const p=proj(); const needle=q.toLowerCase().trim(); const res=[];
  const push=(kind,title,snippet,action)=>res.push({kind,title,snippet,action});
  const hit=(t)=>(t||"").toLowerCase().includes(needle);
  p.chapters.forEach(ch=>ch.scenes.forEach(sc=>{
    if(hit(sc.title)||hit(sc.text)||hit(sc.summary))
      push("Szene", sc.title||"Ohne Titel", snippet(sc.text||sc.summary, needle),
           ()=>openScene(ch.id,sc.id));
  }));
  const scanEnt=(arr,kind)=>arr.forEach(e=>{
    const blob=[e.name,e.aliases,e.role,e.type,e.category,e.goal,e.conflict,e.arc,e.backstory,e.description,e.notes].join(" ");
    if(hit(blob)) push(kind, e.name, snippet(blob, needle), ()=>openEntity(e.id));
  });
  scanEnt(p.characters,"Figur"); scanEnt(p.places,"Ort"); scanEnt(p.elements,"Weltelement");
  p.ideas.forEach(i=>{ if(hit(i.text)) push("Idee", i.text.slice(0,60), snippet(i.text,needle), ()=>go("ideas")); });
  if(hit(p.notes)) push("Notiz","Notizen", snippet(p.notes,needle), ()=>go("notes"));
  return res;
}
function snippet(text, needle){
  const t=(text||"").replace(/\s+/g," "); const i=t.toLowerCase().indexOf(needle);
  if(i<0) return esc(t.slice(0,90));
  const start=Math.max(0,i-35), end=Math.min(t.length,i+needle.length+55);
  return (start>0?"…":"")+esc(t.slice(start,i))+"<mark>"+esc(t.slice(i,i+needle.length))+"</mark>"+esc(t.slice(i+needle.length,end))+(end<t.length?"…":"");
}
function renderSearchResults(){
  const m=document.getElementById("main"); m.innerHTML='<div class="view"></div>'; const v=m.querySelector(".view");
  const res=searchAll(SEARCH_Q);
  v.innerHTML=`<h2>Suche</h2><p class="lead">${res.length} Treffer für „${esc(SEARCH_Q)}".</p>`+
    (res.length? res.map((r,i)=>`<div class="result" data-i="${i}">
      <div class="rk">${r.kind}</div><div style="font-family:var(--serif);font-size:17px">${esc(r.title)}</div>
      <div class="muted" style="margin-top:3px">${r.snippet}</div></div>`).join("")
      : '<div class="empty"><div class="big">🔍</div><p>Nichts gefunden.</p></div>');
  v.querySelectorAll(".result").forEach(el=>el.onclick=()=>res[+el.dataset.i].action());
}

/* ============================================================
   Ansichten
   ============================================================ */
const VIEWS = {};
VIEWS.search = renderSearchResults;

/* ---------- Dashboard ---------- */
VIEWS.dashboard = ()=>{
  const p=proj();
  const scenes = p.chapters.reduce((a,c)=>a+c.scenes.length,0);
  const done = p.chapters.reduce((a,c)=>a+c.scenes.filter(s=>s.status==="done").length,0);
  const words = projWordCount();
  const pct = scenes? Math.round(done/scenes*100):0;
  const m = mount();
  m.innerHTML = `
    <div class="row"><h2>${esc(p.meta.title)}</h2><div class="spacer"></div>
      <button class="btn small" id="editMeta">Projekt bearbeiten</button></div>
    <p class="lead">${p.meta.logline? esc(p.meta.logline) :
        "Noch keine Logline. Beschreibe deine Geschichte in einem Satz – das gibt dir Richtung."}</p>

    <div class="stats">
      <div class="stat"><div class="n">${words.toLocaleString('de-DE')}</div><div class="l">Wörter</div></div>
      <div class="stat"><div class="n">${scenes}</div><div class="l">Szenen</div></div>
      <div class="stat"><div class="n">${p.characters.length}</div><div class="l">Figuren</div></div>
      <div class="stat"><div class="n">${p.places.length}</div><div class="l">Orte</div></div>
      <div class="stat"><div class="n">${pct}%</div><div class="l">fertige Szenen
        <div class="progressbar"><i style="width:${pct}%"></i></div></div></div>
    </div>

    <div class="grid cols">
      <div class="card">
        <h3>Tagesziel</h3>
        ${dailyGoalHtml(p)}
      </div>
      <div class="card">
        <h3>Worum geht es?</h3>
        <p>${p.meta.premise? esc(p.meta.premise).replace(/\n/g,"<br>") :
            "Halte in ein bis zwei Sätzen fest, was das Herz deiner Geschichte ist. Klick auf „Projekt bearbeiten“."}</p>
        ${p.meta.genre?`<div style="margin-top:10px"><span class="tag role">${esc(p.meta.genre)}</span></div>`:""}
      </div>
      <div class="card">
        <h3>Nächste Schritte</h3>
        <div class="link-list" style="margin-top:8px">
          ${scenes===0?'<div>• <span class="lk" data-go="manuscript">Erste Szene schreiben</span></div>':''}
          ${p.characters.length===0?'<div>• <span class="lk" data-go="characters">Hauptfigur anlegen</span></div>':''}
          ${!p.meta.logline?'<div>• <span class="lk" data-meta="1">Logline formulieren</span></div>':''}
          ${p.ideas.filter(i=>!i.done).length?'<div>• <span class="lk" data-go="ideas">Offene Ideen ansehen</span></div>':''}
          <div>• <span class="lk" data-go="ideas">Story-Struktur planen</span></div>
        </div>
      </div>
      <div class="card">
        <h3>Zuletzt bearbeitet</h3>
        <div class="link-list" style="margin-top:8px">
          ${recentScenes().map(r=>`<div>• <span class="lk" data-scene="${r.chapter.id}:${r.scene.id}">${esc(r.scene.title||"Ohne Titel")}</span> <span class="muted">(${wordCount(r.scene.text)} W.)</span></div>`).join("")||'<span class="muted">Noch nichts geschrieben.</span>'}
        </div>
      </div>
    </div>`;
  m.querySelector("#editMeta").onclick=openMeta;
  m.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(e.dataset.go));
  m.querySelectorAll("[data-meta]").forEach(e=>e.onclick=openMeta);
  m.querySelectorAll("[data-scene]").forEach(e=>e.onclick=()=>{
    const [c,s]=e.dataset.scene.split(":"); openScene(c,s);
  });
  const gb=m.querySelector("#setGoal"); if(gb) gb.onclick=openGoal;
};
function dailyGoalHtml(p){
  const goal=p.meta.dailyGoal||0; const today=wordsToday();
  if(!goal){
    return `<p>Setz dir ein kleines tägliches Wortziel – das hält dich dran, ganz ohne Druck.</p>
      <p class="muted" style="margin-top:6px">Heute geschrieben: <strong>${today}</strong> Wörter.</p>
      <button class="btn small" id="setGoal" style="margin-top:10px">Tagesziel festlegen</button>`;
  }
  const pct=Math.min(100, Math.round(today/goal*100));
  const done=today>=goal;
  return `<div class="ring-wrap">
      <div class="ring" style="--p:${pct}"><i>${pct}%</i></div>
      <div><div style="font-size:22px;font-family:var(--serif)">${today} / ${goal}</div>
        <div class="muted">Wörter heute${done?' &nbsp;🎉 Ziel erreicht!':''}</div>
        <button class="btn ghost small" id="setGoal" style="margin-top:6px;padding-left:0">Ziel ändern</button></div>
    </div>`;
}
function openGoal(){
  const p=proj();
  modal(`<h3>Tägliches Schreibziel</h3>
    <p class="muted" style="margin-top:2px">Wie viele Wörter möchtest du pro Tag schreiben? Für Einsteiger sind 200–500 ein guter Anfang. 0 = ausschalten.</p>
    <label class="f"><span class="lbl">Wörter pro Tag</span>
      <input class="in" id="goalIn" type="number" min="0" step="50" value="${p.meta.dailyGoal||0}"></label>`,
    ()=>{ p.meta.dailyGoal=Math.max(0, parseInt(val("goalIn"))||0); save(); render(); });
}
function recentScenes(){
  const out=[];
  proj().chapters.forEach(c=>c.scenes.forEach(s=>out.push({chapter:c,scene:s})));
  return out.filter(r=>r.scene.text||r.scene.title).slice(-4).reverse();
}
function openMeta(){
  const p=proj();
  modal(`<h3>Projekt bearbeiten</h3>
    <label class="f"><span class="lbl">Titel</span><input class="in" id="mTitle" value="${esc(p.meta.title)}"></label>
    <div class="two">
      <label class="f"><span class="lbl">Genre</span><input class="in" id="mGenre" value="${esc(p.meta.genre)}" placeholder="z. B. Fantasy, Krimi"></label>
      <label class="f"><span class="lbl">Logline (ein Satz)</span><input class="in" id="mLog" value="${esc(p.meta.logline)}" placeholder="Ein X muss Y, weil Z."></label>
    </div>
    <label class="f"><span class="lbl">Worum geht es? (Prämisse)</span><textarea class="in" id="mPrem" placeholder="Das Herz deiner Geschichte in ein paar Sätzen.">${esc(p.meta.premise)}</textarea></label>`,
    ()=>{
      p.meta.title=val("mTitle")||"Ohne Titel"; p.meta.genre=val("mGenre");
      p.meta.logline=val("mLog"); p.meta.premise=val("mPrem"); save(); render();
    });
}

/* ---------- Manuskript ---------- */
VIEWS.manuscript = ()=>{
  const p=proj();
  const m=document.getElementById("main");
  if(p.chapters.length===0){
    const v=mount();
    v.innerHTML=`<h2>Manuskript</h2>
      <p class="lead">Deine Geschichte entsteht in Kapiteln und Szenen – wie im Karteikasten eines Autorenprogramms. Fang mit einer einzigen Szene an; alles andere kannst du später umsortieren.</p>

/* ---------- Drag & Drop im Binder ---------- */
let DRAG=null;
function wireBinderDnD(b){
  const clearMarks=()=>b.querySelectorAll(".drop-before,.drop-after,.drop-into,.dragging")
      .forEach(el=>el.classList.remove("drop-before","drop-after","drop-into","dragging"));
  // Szenen
  b.querySelectorAll(".scene-item").forEach(el=>{
    el.addEventListener("dragstart",e=>{ DRAG={type:"scene",scId:el.dataset.scid,chId:el.dataset.scch};
      el.classList.add("dragging"); e.stopPropagation(); e.dataTransfer.effectAllowed="move"; });
    el.addEventListener("dragend",clearMarks);
    el.addEventListener("dragover",e=>{
      if(!DRAG||DRAG.type!=="scene") return; e.preventDefault(); e.stopPropagation();
      const r=el.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2;
      el.classList.remove("drop-before","drop-after");
      el.classList.add(after?"drop-after":"drop-before");
    });
    el.addEventListener("dragleave",()=>el.classList.remove("drop-before","drop-after"));
    el.addEventListener("drop",e=>{
      if(!DRAG||DRAG.type!=="scene") return; e.preventDefault(); e.stopPropagation();
      const after=el.classList.contains("drop-after");
      moveScene(DRAG.scId, el.dataset.scch, el.dataset.scid, after); DRAG=null; clearMarks();
    });
  });
  // Kapitel (Drop-Ziel für Szenen: ans Ende; und Kapitel-Reihenfolge)
  b.querySelectorAll(".chapter").forEach(ch=>{
    ch.addEventListener("dragover",e=>{
      if(!DRAG) return; e.preventDefault();
      if(DRAG.type==="scene") ch.classList.add("drop-into");
    });
    ch.addEventListener("dragleave",()=>ch.classList.remove("drop-into"));
    ch.addEventListener("drop",e=>{
      if(!DRAG) return;
      if(DRAG.type==="scene" && !e.target.closest(".scene-item")){
        e.preventDefault(); moveScene(DRAG.scId, DRAG.chId, null, true, ch.dataset.ch);
      }
      ch.classList.remove("drop-into"); if(DRAG&&DRAG.type==="scene") DRAG=null;
    });
  });
  b.querySelectorAll("[data-chdrag]").forEach(h=>{
    h.addEventListener("dragstart",e=>{ DRAG={type:"chapter",chId:h.dataset.chdrag};
      h.closest(".chapter").classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
    h.addEventListener("dragend",clearMarks);
    h.addEventListener("dragover",e=>{
      if(!DRAG||DRAG.type!=="chapter") return; e.preventDefault();
      const chEl=h.closest(".chapter"); const r=chEl.getBoundingClientRect();
      chEl.classList.remove("drop-before","drop-after");
      chEl.classList.add(e.clientY>r.top+r.height/2?"drop-after":"drop-before");
    });
    h.addEventListener("dragleave",()=>h.closest(".chapter").classList.remove("drop-before","drop-after"));
    h.addEventListener("drop",e=>{
      if(!DRAG||DRAG.type!=="chapter") return; e.preventDefault();
      const chEl=h.closest(".chapter"); const after=chEl.classList.contains("drop-after");
      moveChapter(DRAG.chId, chEl.dataset.ch, after); DRAG=null; clearMarks();
    });
  });
}
function moveScene(scId, targetChId, targetScId, after, intoChId){
  const p=proj();
  let sc=null, fromCh=null;
  for(const ch of p.chapters){ const i=ch.scenes.findIndex(s=>s.id===scId);
    if(i>=0){ sc=ch.scenes[i]; fromCh=ch; ch.scenes.splice(i,1); break; } }
  if(!sc) return;
  if(intoChId){ const ch=p.chapters.find(c=>c.id===intoChId); ch.scenes.push(sc); }
  else{
    const ch=p.chapters.find(c=>c.id===targetChId);
    let idx=ch.scenes.findIndex(s=>s.id===targetScId);
    if(idx<0) idx=ch.scenes.length; else idx=after?idx+1:idx;
    ch.scenes.splice(idx,0,sc);
  }
  save(); renderBinder();
}
function moveChapter(chId, targetChId, after){
  const p=proj();
  const i=p.chapters.findIndex(c=>c.id===chId); if(i<0) return;
  const [ch]=p.chapters.splice(i,1);
  let idx=p.chapters.findIndex(c=>c.id===targetChId);
  if(idx<0) idx=p.chapters.length; else idx=after?idx+1:idx;
  p.chapters.splice(idx,0,ch); save(); renderBinder();
}

  w.querySelector("#scSummary").oninput=debounce(e=>{ sc.summary=e.target.value; save(); },400);
  w.querySelector("#scStatus").onchange=e=>{ sc.status=e.target.value; save(); renderBinder(); };
  w.querySelector("#scPov").onchange=e=>{ sc.pov=e.target.value; save(); };

  w.querySelector("#scThread").onchange=e=>{
    if(e.target.value==="__new"){ newThread(id=>{ sc.thread=id; save(); renderEditor(); renderBinder(); }); return; }
    sc.thread=e.target.value; save(); renderBinder();
  };
  w.querySelector("#delScene").onclick=()=>{
    if(confirm("Diese Szene löschen?")){ ch.scenes=ch.scenes.filter(s=>s.id!==sc.id); EDIT_SCENE=null; save(); VIEWS.manuscript(); }

/* ---------- Beziehungen ---------- */
function relationsOf(id){
  const p=proj(); const out=[];
  for(const r of p.relationships){
    if(r.from===id){ const o=findEntity(r.to); if(o) out.push({...r, otherId:r.to, otherName:o.name}); }
    else if(r.to===id){ const o=findEntity(r.from); if(o) out.push({...r, otherId:r.from, otherName:o.name, label:r.labelRev||r.label}); }
  }
  return out;
}

// Figurenpaare, die oft zusammen auftreten, aber keine Beziehung haben
function coappearanceSuggestions(){
  const p=proj(); const counts={};
  for(const ch of p.chapters) for(const sc of ch.scenes){
    const chars=detectInText(sc.text).characters.map(c=>c.id);
    for(let i=0;i<chars.length;i++) for(let j=i+1;j<chars.length;j++){
      const key=[chars[i],chars[j]].sort().join(":"); counts[key]=(counts[key]||0)+1;
    }
  }
  const has=(a,b)=>p.relationships.some(r=>(r.from===a&&r.to===b)||(r.from===b&&r.to===a));
  const ignored=p._ignoredSugg||[];
  return Object.entries(counts).map(([k,count])=>{ const[a,b]=k.split(":"); return {a,b,count,key:k}; })
    .filter(s=>s.count>=2 && !has(s.a,s.b) && !ignored.includes(s.key))
    .map(s=>({a:findEntity(s.a), b:findEntity(s.b), count:s.count}))
    .filter(s=>s.a&&s.b)
    .sort((x,y)=>y.count-x.count).slice(0,5);
}

function drawGraph(container, nodes){
  const p=proj(); const gp=graphPos();
  const W=container.clientWidth||760, H=Math.max(340, Math.min(600, 160+nodes.length*26));
  const cx=W/2, cy=H/2, R=Math.min(W,H)/2-72;
  const pos={};
  nodes.forEach((n,i)=>{
    if(gp[n.id]){ pos[n.id]={x:gp[n.id].x*W, y:gp[n.id].y*H}; }
    else{ const ang=(i/nodes.length)*Math.PI*2 - Math.PI/2;
      pos[n.id]={x:cx+R*Math.cos(ang), y:cy+R*Math.sin(ang)}; }
  });
  // effektive Zustände je Beziehung zum gewählten Handlungs-Stand
  const eff={};
  p.relationships.forEach(r=>{ eff[r.id]=effectiveRel(r, REL_CHAPTER); });
  const visibleRels=p.relationships.filter(r=>pos[r.from]&&pos[r.to]&&eff[r.id].visible);
  const focusSet=new Set();
  if(REL_FOCUS){ focusSet.add(REL_FOCUS);
    visibleRels.forEach(r=>{ if(r.from===REL_FOCUS) focusSet.add(r.to); if(r.to===REL_FOCUS) focusSet.add(r.from); }); }

  const edgeSvg=(r)=>{
    const a=pos[r.from], b=pos[r.to]; const e=eff[r.id];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1; const ux=dx/len, uy=dy/len;
    const x1=a.x+ux*24, y1=a.y+uy*24, x2=b.x-ux*26, y2=b.y-uy*26;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const col=catOf(r.category).color; const w=STRENGTH_WIDTH[e.strength]||3;
    const dash=e.tension==="cold"?'stroke-dasharray="6 4"':'';
    const hi=REL_FOCUS&&(r.from===REL_FOCUS||r.to===REL_FOCUS)?" hi":"";
    const ah=7+w, ang=Math.atan2(uy,ux);
    const p1x=x2-ah*Math.cos(ang-0.4), p1y=y2-ah*Math.sin(ang-0.4);
    const p2x=x2-ah*Math.cos(ang+0.4), p2y=y2-ah*Math.sin(ang+0.4);
    const icon=tensionOf(e.tension).icon;
    const lbl=((e.label||"")+(icon?" "+icon:"")).slice(0,24);
    return `<g class="edge-g" data-from="${r.from}" data-to="${r.to}">
      <line class="edge${hi}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" ${dash}></line>
      <polygon class="arrow${hi}" points="${x2},${y2} ${p1x},${p1y} ${p2x},${p2y}" fill="${col}"></polygon>
      <text class="edge-label${hi}" x="${mx}" y="${my-5}" text-anchor="middle">${esc(lbl)}</text></g>`;
  };
  const nodeSvg=(n)=>{
    const pt=pos[n.id]; const isChar=p.characters.some(c=>c.id===n.id);
    const isElem=p.elements.some(c=>c.id===n.id);
    const lbl=n.name.length>16?n.name.slice(0,15)+"…":n.name;
    const hi=REL_FOCUS&&focusSet.has(n.id)?" hi":"";
    const glyph=isChar?initials(n.name):(isElem?"✦":"◈");
    return `<g class="node${hi}" data-ent="${n.id}">
      <circle cx="${pt.x}" cy="${pt.y}" r="22"></circle>
      <text class="glyph" x="${pt.x}" y="${pt.y+4}" text-anchor="middle" font-family="var(--serif)" font-weight="600">${glyph}</text>
      <text class="name" x="${pt.x}" y="${pt.y+38}" text-anchor="middle">${esc(lbl)}</text></g>`;
  };
  container.innerHTML=`<svg class="graph ${REL_FOCUS?'focused':''}" viewBox="0 0 ${W} ${H}" style="height:${H}px;touch-action:none">
    ${visibleRels.map(edgeSvg).join("")}${nodes.map(nodeSvg).join("")}</svg>`;
  const svg=container.querySelector("svg");

  // Position eines Knotens live aktualisieren (ohne Neuaufbau)
  const updateNode=(id)=>{
    const pt=pos[id];
    const g=svg.querySelector(`.node[data-ent="${id}"]`); if(!g) return;
    g.querySelector("circle").setAttribute("cx",pt.x); g.querySelector("circle").setAttribute("cy",pt.y);
    const gl=g.querySelector(".glyph"); gl.setAttribute("x",pt.x); gl.setAttribute("y",pt.y+4);
    const nm=g.querySelector(".name"); nm.setAttribute("x",pt.x); nm.setAttribute("y",pt.y+38);
    svg.querySelectorAll(".edge-g").forEach(eg=>{
      if(eg.dataset.from!==id && eg.dataset.to!==id) return;
      const a=pos[eg.dataset.from], b=pos[eg.dataset.to];
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
      const x1=a.x+ux*24, y1=a.y+uy*24, x2=b.x-ux*26, y2=b.y-uy*26;
      const ln=eg.querySelector("line"); const w=+ln.getAttribute("stroke-width")||3;
      ln.setAttribute("x1",x1);ln.setAttribute("y1",y1);ln.setAttribute("x2",x2);ln.setAttribute("y2",y2);
      const ah=7+w, ang=Math.atan2(uy,ux);
      eg.querySelector("polygon").setAttribute("points",
        `${x2},${y2} ${x2-ah*Math.cos(ang-0.4)},${y2-ah*Math.sin(ang-0.4)} ${x2-ah*Math.cos(ang+0.4)},${y2-ah*Math.sin(ang+0.4)}`);
      const t=eg.querySelector("text"); t.setAttribute("x",(x1+x2)/2); t.setAttribute("y",(y1+y2)/2-5);
    });
  };
  const toSvg=(ev)=>{ const rect=svg.getBoundingClientRect();
    return { x:(ev.clientX-rect.left)*(W/rect.width), y:(ev.clientY-rect.top)*(H/rect.height) }; };

  let drag=null, moved=false;
  svg.querySelectorAll(".node").forEach(g=>{
    g.style.cursor="grab";
    g.addEventListener("pointerdown",ev=>{
      ev.preventDefault(); const id=g.dataset.ent; const s=toSvg(ev);
      drag={id, dx:s.x-pos[id].x, dy:s.y-pos[id].y}; moved=false;
      g.setPointerCapture(ev.pointerId); g.style.cursor="grabbing";
    });
    g.addEventListener("pointermove",ev=>{
      if(!drag) return; const s=toSvg(ev);
      const nx=Math.max(26,Math.min(W-26, s.x-drag.dx)), ny=Math.max(26,Math.min(H-30, s.y-drag.dy));
      if(Math.abs(nx-pos[drag.id].x)>2||Math.abs(ny-pos[drag.id].y)>2) moved=true;
      pos[drag.id]={x:nx,y:ny}; updateNode(drag.id);
    });
    g.addEventListener("pointerup",ev=>{
      g.style.cursor="grab";
      if(drag && moved){ gp[drag.id]={x:pos[drag.id].x/W, y:pos[drag.id].y/H}; save(); VIEWS.relations(); drag=null; return; }
      // Klick (ohne Ziehen): fokussieren / öffnen
      const id=g.dataset.ent; drag=null;
      if(REL_FOCUS===id) openEntity(id); else { REL_FOCUS=id; VIEWS.relations(); }
    });
  });
}

    </div>

    <div class="two" style="align-items:start">
      <div>
        <h3 style="font-family:var(--serif)">Ideenspeicher</h3>
        <div class="row" style="margin:10px 0">
          <input class="in" id="ideaIn" placeholder="Neue Idee, Szene, Was-wäre-wenn…">
          <button class="btn" id="addIdea">＋</button>
        </div>
        <div id="ideaList"></div>
      </div>
      <div>
        <h3 style="font-family:var(--serif)">Aufbau in 7 Schritten</h3>
        <p class="muted" style="font-size:13px">Eine einfache Struktur für den Einstieg. Nutze sie als Landkarte, nicht als Korsett.</p>
        <div class="card" style="margin-top:10px">
          ${BEATS.map((b,i)=>`<div class="beat"><div class="num">${i+1}</div>
            <div><div class="bt">${b.t}</div><div class="bd">${b.d}</div>
            <textarea class="in" data-beat="${i}" style="margin-top:6px;min-height:44px" placeholder="Deine Notizen…">${esc((p.structure&&p.structure[i])||"")}</textarea>
            </div></div>`).join("")}
        </div>
      </div>
    </div>`;
  const renderIdeas=()=>{
    const il=m.querySelector("#ideaList");
    if(p.ideas.length===0){ il.innerHTML='<p class="muted">Noch keine Ideen. Schreib einfach drauflos – nichts ist zu klein.</p>'; return; }
    il.innerHTML=p.ideas.map(i=>`<div class="idea ${i.done?'done':''}">
      <input type="checkbox" data-done="${i.id}" ${i.done?'checked':''}>
      <div class="txt">${esc(i.text)}</div>
      <button class="btn ghost small" data-delidea="${i.id}">🗑</button></div>`).join("");
    il.querySelectorAll("[data-done]").forEach(c=>c.onchange=()=>{
      const it=p.ideas.find(x=>x.id===c.dataset.done); it.done=c.checked; save(); renderIdeas(); renderNav();
    });
    il.querySelectorAll("[data-delidea]").forEach(b=>b.onclick=()=>{
      p.ideas=p.ideas.filter(x=>x.id!==b.dataset.delidea); save(); renderIdeas(); renderNav();
    });
  };
  renderIdeas();
  const addIdea=(text)=>{ if(!text.trim())return; p.ideas.unshift({id:uid(),text:text.trim(),done:false}); save(); renderIdeas(); renderNav(); };
  m.querySelector("#addIdea").onclick=()=>{ const el=m.querySelector("#ideaIn"); addIdea(el.value); el.value=""; el.focus(); };
  m.querySelector("#ideaIn").onkeydown=e=>{ if(e.key==="Enter"){ addIdea(e.target.value); e.target.value=""; } };
  m.querySelector("#savePrompt").onclick=()=>{ const el=m.querySelector("#promptAns");
    if(el.value.trim()){ addIdea("["+PROMPTS[promptIdx]+"] "+el.value); el.value=""; toast("Als Idee gespeichert."); } };
  m.querySelector("#nextPrompt").onclick=()=>{ p.ideas.push(); // no-op to change count parity
    p._pskip=(p._pskip||0)+1; renderNextPrompt(m,p); };
  m.querySelectorAll("[data-beat]").forEach(t=>t.oninput=debounce(e=>{
    if(!p.structure)p.structure=[]; p.structure[+e.target.dataset.beat]=e.target.value; save();
  },400));
};
function renderNextPrompt(m,p){
  const idx=((projWordCount()+p.ideas.length+(p._pskip||0))%PROMPTS.length);
  m.querySelector(".prompt-box .q").textContent="💭 "+PROMPTS[idx];
  m.querySelector("#savePrompt").onclick=()=>{ const el=m.querySelector("#promptAns");
    if(el.value.trim()){ p.ideas.unshift({id:uid(),text:"["+PROMPTS[idx]+"] "+el.value,done:false}); save(); el.value=""; toast("Gespeichert."); VIEWS.ideas(); } };
}

/* ---------- Zeitstrahl ---------- */
let TL_FILTER = ""; // Strang-Filter
VIEWS.timeline = ()=>{
  const p=proj(); const m=mount();
  const total=p.chapters.reduce((a,c)=>a+c.scenes.length,0);
  m.innerHTML=`<div class="row"><h2>Zeitstrahl</h2><div class="spacer"></div>
      <button class="btn small" id="manageThreads">Stränge verwalten</button>
      <button class="btn small" data-go="manuscript">Zum Manuskript</button></div>
    <p class="lead">Der Verlauf deiner Handlung in Leserichtung. So siehst du auf einen Blick, was wann passiert, wer dabei ist und wie weit du bist. Trage in einer Szene „Wann?" ein oder ordne sie einem farbigen Handlungsstrang zu.</p>`;
  if(total===0){
    m.innerHTML+=`<div class="empty"><div class="big">📅</div><p>Noch keine Szenen. <span class="lk" data-go="manuscript" style="color:var(--accent);cursor:pointer">Schreib deine erste Szene.</span></p></div>`;
    m.querySelector("#manageThreads").onclick=manageThreads;
    m.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(e.dataset.go)); return;
  }
  // Strang-Filter
  if(threads().length){
    m.innerHTML+=`<div class="row wrap" style="margin-bottom:16px" id="tlFilter">
      <span class="thread-chip ${TL_FILTER===""?"active":""}" data-tf="">Alle Stränge</span>
      ${threads().map(t=>`<span class="thread-chip ${TL_FILTER===t.id?"active":""}" data-tf="${t.id}">
        <span class="d" style="background:${t.color}"></span>${esc(t.name)}</span>`).join("")}</div>`;
  }
  let html='<div class="tl">'; let shown=0;
  p.chapters.forEach(ch=>{
    const scenes=ch.scenes.filter(sc=>!TL_FILTER||sc.thread===TL_FILTER);
    if(!scenes.length) return;
    html+=`<div class="tl-chapter">${esc(ch.title||"Kapitel")}</div>`;
    scenes.forEach(sc=>{
      shown++;
      const det=detectInText(sc.text);
      const pov=sc.pov?findEntity(sc.pov):null;
      const who=[...new Set([...(pov?[pov.name]:[]),...det.characters.map(c=>c.name)])];
      const places=det.places.map(pl=>pl.name);
      const statusLbl={done:"✓ Fertig",draft:"✎ Entwurf"}[sc.status]||"· Idee";
      const th=sc.thread?threadById(sc.thread):null;
      html+=`<div class="tl-node ${sc.status||'todo'}">
        <div class="tl-card" data-sc="${ch.id}:${sc.id}" style="border-left-color:${th?th.color:'var(--line)'}">
          ${sc.when?`<span class="tl-when">${esc(sc.when)}</span> `:""}
          ${th?`<span class="thread-chip active" style="font-size:11px"><span class="d" style="background:${th.color}"></span>${esc(th.name)}</span><br>`:(sc.when?"<br>":"")}
          <span class="tl-title">${esc(sc.title||"Ohne Titel")}</span>
          <span class="pill" style="margin-left:8px;font-size:11px">${statusLbl}</span>
          ${sc.summary?`<div class="tl-sum">${esc(sc.summary)}</div>`:""}
          <div class="tl-meta">
            ${who.length?`👤 ${who.map(esc).join(", ")}`:""}
            ${who.length&&places.length?" · ":""}
            ${places.length?`🗺️ ${places.map(esc).join(", ")}`:""}
            ${!who.length&&!places.length?`<span class="muted">${wordCount(sc.text)} Wörter</span>`:` · ${wordCount(sc.text)} W.`}
          </div>
        </div></div>`;
    });
  });
  html+="</div>";
  m.innerHTML+= shown? html : '<p class="muted">Keine Szenen in diesem Strang.</p>';
  m.querySelector("#manageThreads").onclick=manageThreads;
  m.querySelectorAll("[data-tf]").forEach(e=>e.onclick=()=>{ TL_FILTER=e.dataset.tf; VIEWS.timeline(); });
  m.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(e.dataset.go));
  m.querySelectorAll("[data-sc]").forEach(e=>e.onclick=()=>{ const[c,s]=e.dataset.sc.split(":"); openScene(c,s); });
};

/* ---------- Manuskript-Export (lesbares Dokument) ---------- */
function buildManuscript(opts){
  const p=proj();
  const paras=(t)=>(t||"").split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
  if(opts.format==="text"){
    let out=p.meta.title.toUpperCase()+"\n";
    if(p.meta.logline) out+="\n"+p.meta.logline+"\n";
    out+="\n\n";
    p.chapters.forEach(ch=>{
      if(!ch.scenes.length) return;
      out+="\n\n"+(ch.title||"Kapitel").toUpperCase()+"\n\n";
      ch.scenes.forEach((sc,i)=>{
        if(opts.titles && sc.title){ out+=(sc.title)+"\n\n"; }
        else if(i>0){ out+="* * *\n\n"; }
        out+=(sc.text||"").trim()+"\n\n";
      });
    });
    return out.trim()+"\n";
  }
  // HTML zum Ansehen/Drucken
  const chapters=p.chapters.filter(ch=>ch.scenes.length).map(ch=>{
    const scenes=ch.scenes.map((sc,i)=>{
      const body=paras(sc.text).map(x=>`<p>${esc(x)}</p>`).join("")||`<p class="empty-scene">(noch nichts geschrieben)</p>`;
      const head=opts.titles&&sc.title?`<h3>${esc(sc.title)}</h3>`:(i>0?`<p class="sep">* * *</p>`:"");
      return head+body;
    }).join("");
    return `<section class="chapter"><h2>${esc(ch.title||"Kapitel")}</h2>${scenes}</section>`;
  }).join("");
  return `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
    <title>${esc(p.meta.title)}</title><style>
    @page{margin:2.5cm}
    body{font-family:Georgia,"Times New Roman",serif;max-width:720px;margin:40px auto;padding:0 24px;
      color:#222;line-height:1.7;font-size:18px}
    .title-page{text-align:center;margin:12vh 0 20vh}
    .title-page h1{font-size:34px;margin:0 0 12px}
    .title-page .log{font-style:italic;color:#555;font-size:18px;max-width:460px;margin:0 auto}
    h2{font-size:24px;margin:0 0 24px;text-align:center;page-break-before:always}
    h3{font-size:19px;text-align:center;font-weight:normal;font-style:italic;color:#555;margin:28px 0 12px}
    p{margin:0;text-indent:1.6em}
    section.chapter > p:first-of-type,p.sep + p{text-indent:0}
    p.sep{text-align:center;text-indent:0;margin:22px 0;color:#999;letter-spacing:4px}
    p.empty-scene{color:#aaa;font-style:italic;text-indent:0}
    .toolbar{position:fixed;top:0;left:0;right:0;background:#f3ede1;border-bottom:1px solid #ddd;
      padding:10px;text-align:center;font-family:-apple-system,Segoe UI,sans-serif;font-size:14px}
    .toolbar button{padding:7px 16px;margin:0 4px;border:1px solid #b98;border-radius:7px;background:#fff;cursor:pointer;font-size:14px}
    .toolbar button.primary{background:#9a6a3c;color:#fff;border-color:#9a6a3c}
    @media print{.toolbar{display:none}body{margin-top:0}}
    </style></head><body>
    <div class="toolbar">📖 Vorschau deines Manuskripts &nbsp;
      <button class="primary" onclick="window.print()">Drucken / als PDF speichern</button>
      <button onclick="window.close()">Schließen</button></div>
    <div style="height:52px"></div>
    <div class="title-page"><h1>${esc(p.meta.title)}</h1>
      ${p.meta.logline?`<p class="log">${esc(p.meta.logline)}</p>`:""}</div>
    ${chapters||"<p>Noch keine Szenen vorhanden.</p>"}
    </body></html>`;
}
function openExport(){
  const p=proj();
  modal(`<h3>Manuskript exportieren</h3>
    <p class="muted" style="margin-top:2px">Verwandelt deine Szenen in ein durchgehendes, lesbares Dokument – gut zum Korrekturlesen oder Weitergeben.</p>
    <label class="f"><span class="lbl">Szenen trennen durch</span>
      <select class="in" id="exTitles">
        <option value="1">Szenentitel als Überschrift</option>
        <option value="0">Sternchen * * * (Titel weglassen)</option>
      </select></label>
    <div class="row wrap" style="margin-top:18px">
      <button class="btn primary" id="exPreview">📖 Vorschau &amp; Drucken/PDF</button>
      <button class="btn" id="exHtml">Als HTML-Datei</button>
      <button class="btn" id="exText">Als Textdatei (.txt)</button>
    </div>`,
    null, (root)=>{
      root.querySelector(".foot").innerHTML=`<button class="btn ghost" onclick="closeModal()">Schließen</button>`;
      const titles=()=>root.querySelector("#exTitles").value==="1";
      root.querySelector("#exPreview").onclick=()=>{
        const w=window.open("","_blank");
        if(!w){ toast("Bitte Pop-ups für diese Seite erlauben."); return; }
        w.document.write(buildManuscript({format:"html",titles:titles()})); w.document.close();
      };
      root.querySelector("#exHtml").onclick=()=>{
        download(buildManuscript({format:"html",titles:titles()}), slug(p.meta.title)+".html", "text/html");
      };
      root.querySelector("#exText").onclick=()=>{
        download(buildManuscript({format:"text",titles:titles()}), slug(p.meta.title)+".txt", "text/plain");
      };
    }, true);
}
function slug(s){ return (s||"manuskript").toLowerCase().replace(/[^a-z0-9äöü]+/gi,"-").replace(/^-|-$/g,"")||"manuskript"; }
function download(content, filename, type){
  const blob=new Blob([content],{type:type+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("Heruntergeladen: "+filename);
}

    <p class="lead">Kleine Lektionen und Übungen fürs Handwerk – Schritt für Schritt, ohne Druck. Es geht nicht um ein großes Werk, sondern ums Üben. Hak eine Lektion ab, wenn du sie gelesen (und am besten die Übung gemacht) hast.</p>

    <div class="learn-progress">
      <div class="row"><strong>Dein Fortschritt</strong><div class="spacer"></div>
        <span class="muted">${done} von ${LESSONS.length} Lektionen</span></div>
      <div class="progressbar" style="margin-top:8px"><i style="width:${pct}%"></i></div>
    </div>

    <div class="warmup">
      <div class="q">✍️ Schreibimpuls</div>
      <div style="margin-bottom:10px">${WARMUPS[wIdx]}</div>
      <div class="row wrap">
        <button class="btn" id="wNote">In Notizen übernehmen</button>
        <button class="btn ghost" id="wNext">Anderer Impuls</button>
      </div>
    </div>

    <div class="row" style="margin:22px 0 10px"><h3 style="font-family:var(--serif);margin:0">Neue Geschichte starten</h3></div>
    <div class="card"><div class="row">
      <div style="flex:1"><p style="margin:0">Du hast eine vage Idee, weißt aber nicht, wie anfangen? Der Story-Starter führt dich in vier kleinen Schritten von der Idee zu Logline, Prämisse und erster Szene.</p></div>
      <button class="btn primary" id="startWizard">Story-Starter öffnen</button>
    </div></div>

    <div class="row" style="margin:24px 0 10px"><h3 style="font-family:var(--serif);margin:0">Mini-Lektionen</h3></div>
    <div id="lessons"></div>`;
  m.querySelector("#wNote").onclick=()=>{ proj().notes=(proj().notes?proj().notes+"\n\n":"")+"✍️ "+WARMUPS[wIdx]+"\n"; save(); toast("In Notizen übernommen."); };
  m.querySelector("#wNext").onclick=()=>{ ls._wskip=(ls._wskip||0)+1; VIEWS.learn(); };
  m.querySelector("#startWizard").onclick=openStoryStarter;
  const box=m.querySelector("#lessons");
  box.innerHTML=LESSONS.map(l=>{
    const isDone=!!ls.done[l.id];
    return `<div class="lesson" data-l="${l.id}">
      <div class="lesson-h" data-toggle="${l.id}">
        <span class="ico">${l.ico}</span>
        <span class="t">${l.title}</span>
        <span class="chk ${isDone?'on':''}" data-done="${l.id}" title="Als gelesen markieren">${isDone?'✓':''}</span>
      </div>
      <div class="lesson-body" id="lb_${l.id}" style="display:none">
        ${l.body.map(x=>`<p>${x}</p>`).join("")}
        <div class="lesson-ex"><div class="lbl">Übung</div><div style="margin-top:4px">${l.ex}</div></div>
      </div>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-toggle]").forEach(h=>h.onclick=(e)=>{
    if(e.target.dataset.done!==undefined) return;
    const b=box.querySelector("#lb_"+h.dataset.toggle);
    b.style.display = b.style.display==="none"?"block":"none";
  });
  box.querySelectorAll("[data-done]").forEach(c=>c.onclick=(e)=>{
    e.stopPropagation(); const id=c.dataset.done; ls.done[id]=!ls.done[id]; save(); VIEWS.learn();
  });
};
function openStoryStarter(){
  const data={idea:"",ideaKind:"",who:"",want:"",problem:"",start:""};
  let step=0;
  const steps=[
    {q:"Woher kommt deine Idee?", hint:"Jede Geschichte fängt mit einem Funken an. Wähl, was am ehesten passt – und beschreib ihn in einem Satz.",
     kind:["Ein „Was wäre, wenn …?“","Eine Figur, die mir nicht aus dem Kopf geht","Ein Ort oder ein Bild","Ein Gefühl oder eine Frage"], field:"idea", ph:"Beschreibe deinen Funken in einem Satz…"},
    {q:"Wer steht im Mittelpunkt?", hint:"Wir brauchen jemanden, dem wir folgen. Ein Name reicht fürs Erste – und ein Wunsch.",
     field:"who", ph:"Name der Hauptfigur", field2:"want", ph2:"Was will diese Figur unbedingt?"},
    {q:"Was steht im Weg?", hint:"Ohne Widerstand keine Geschichte. Was macht es der Figur schwer, ihren Wunsch zu erfüllen?",
     field:"problem", ph:"Das Hindernis, der Gegner, das Problem…"},
    {q:"Wo fängt es an?", hint:"Der Moment, in dem sich das normale Leben der Figur zu verändern beginnt. Nah dran anfangen!",
     field:"start", ph:"Der erste Moment / die erste Szene in einem Satz…"},
  ];
  const render=()=>{
    const s=steps[step];
    const kinds = s.kind? `<div style="margin-bottom:14px">${s.kind.map(k=>`<button type="button" class="choice ${data.ideaKind===k?'sel':''}" data-kind="${esc(k)}">${k}</button>`).join("")}</div>`:"";
    const f2 = s.field2? `<label class="f"><span class="lbl">${s.q2||"Wunsch"}</span><input class="in" id="wz2" value="${esc(data[s.field2]||"")}" placeholder="${esc(s.ph2)}"></label>`:"";
    modal(`<h3>Story-Starter</h3>
      <div class="wiz-steps">${steps.map((_,i)=>`<div class="s ${i<=step?'on':''}"></div>`).join("")}</div>
      <div class="wiz-q">${s.q}</div>
      <div class="wiz-hint">${s.hint}</div>
      ${kinds}
      <label class="f"><span class="lbl">${s.field==="who"?"Name":"Dein Satz"}</span>
        <input class="in" id="wz1" value="${esc(data[s.field]||"")}" placeholder="${esc(s.ph)}"></label>
      ${f2}`,
      null,
      (root)=>{
        root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{ data.ideaKind=b.dataset.kind;
          root.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); });
        const foot=root.querySelector(".foot");
        foot.innerHTML=`${step>0?'<button class="btn ghost" id="wzBack">Zurück</button>':''}
          <div class="spacer" style="flex:1"></div>
          <button class="btn primary" id="wzNext">${step===steps.length-1?"Fertig – Geschichte anlegen":"Weiter"}</button>`;
        const save1=()=>{ data[s.field]=root.querySelector("#wz1").value; if(s.field2) data[s.field2]=root.querySelector("#wz2").value; };
        if(step>0) foot.querySelector("#wzBack").onclick=()=>{ save1(); step--; render(); };
        foot.querySelector("#wzNext").onclick=()=>{ save1();
          if(step<steps.length-1){ step++; render(); }
          else finishStoryStarter(data);
        };
      }, true);
  };
  render();
}
function finishStoryStarter(d){
  const p=proj();
  const who=d.who.trim()||"die Hauptfigur";
  const logline=`${who} will ${d.want.trim()||"etwas erreichen"}, aber ${d.problem.trim()||"etwas steht im Weg"}.`;
  p.meta.logline=logline;
  p.meta.premise=(d.idea.trim()? d.idea.trim()+"\n\n":"")+`Im Mittelpunkt steht ${who}. Es beginnt: ${d.start.trim()||"…"}`;
  if(d.who.trim() && !p.characters.some(c=>c.name.toLowerCase()===d.who.trim().toLowerCase())){
    p.characters.push({id:uid(), name:d.who.trim(), role:"Hauptfigur", goal:d.want.trim(), conflict:d.problem.trim()});
  }
  // erste Szene anlegen, falls noch keine Kapitel
  if(p.chapters.length===0){
    const sc={id:uid(), title:"Der Anfang", text:"", summary:d.start.trim(), status:"todo"};
    p.chapters.push({id:uid(), title:"1. Kapitel", scenes:[sc]});
  }
  save(); closeModal(); toast("Grundgerüst angelegt – viel Freude beim Schreiben!"); go("dashboard");
}

/* ---------- KI-Assistent (optional, eigener API-Schlüssel) ---------- */
let CHAT = []; // {role, content}
VIEWS.assistant = ()=>{
  const ai=aiState(); const m=document.getElementById("main");
  if(!ai.key){
    const v=mount();
    v.innerHTML=`<h2>KI-Assistent</h2>
      <p class="lead">Hol dir einen echten Schreib-Coach direkt ins Tool: Der Assistent kennt deine aktuelle Szene, deine Figuren und deine Prämisse und hilft dir beim Weiterdenken – mit Fragen, Ideen und Feedback.</p>
      <div class="card" style="max-width:640px">
        <h3>Einrichten</h3>
        <p>Der Assistent nutzt <strong>Claude</strong> über deinen eigenen API-Schlüssel von Anthropic. So bleibt alles in deiner Hand.</p>
        <ol class="muted" style="line-height:1.9;padding-left:20px">
          <li>Schlüssel erstellen unter <span style="color:var(--accent)">console.anthropic.com</span> → „API Keys".</li>
          <li>Schlüssel unten einfügen. Er wird nur lokal in deinem Browser gespeichert.</li>
        </ol>
        <label class="f"><span class="lbl">Dein API-Schlüssel (beginnt mit sk-ant-…)</span>
          <input class="in" id="aiKey" type="password" placeholder="sk-ant-…"></label>
        <label class="f"><span class="lbl">Modell</span>
          <select class="in" id="aiModel">
            <option value="claude-opus-4-8">Claude Opus 4.8 – höchste Qualität</option>
            <option value="claude-sonnet-5">Claude Sonnet 5 – guter Kompromiss</option>
            <option value="claude-haiku-4-5">Claude Haiku 4.5 – schnell &amp; günstig</option>
          </select></label>
        <div class="row" style="margin-top:16px"><button class="btn primary" id="aiSave">Speichern &amp; loslegen</button></div>
        <p class="muted" style="font-size:12px;margin-top:14px">Hinweis: Jede Anfrage an Claude kostet – je nach Modell – ein paar Cent, abgerechnet über deinen Anthropic-Account. Der Schlüssel verlässt deinen Browser nur, um mit Anthropic zu sprechen. Auf geteilten Rechnern lieber nicht speichern.</p>
      </div>`;
    v.querySelector("#aiSave").onclick=()=>{
      const k=v.querySelector("#aiKey").value.trim();
      if(!k.startsWith("sk-ant-")){ toast("Bitte einen gültigen Schlüssel (sk-ant-…) einfügen."); return; }
      ai.key=k; ai.model=v.querySelector("#aiModel").value; save(); CHAT=[]; VIEWS.assistant();
    };
    return;
  }
  m.innerHTML=`<div class="chat-wrap">
    <div class="editor-bar"><strong style="font-family:var(--serif);font-size:18px">✨ KI-Assistent</strong>
      <span class="pill" id="aiModelLbl">${esc(ai.model)}</span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn ghost small" id="aiClear">Verlauf leeren</button>
      <button class="btn ghost small" id="aiSettings">Einstellungen</button></div>
    <div class="chat-scroll" id="chatScroll"></div>
    <div class="chat-input">
      <div class="quick-row" id="quickRow"></div>
      <div class="inner">
        <textarea id="chatInput" placeholder="Frag den Assistenten etwas… (z. B. „Wie kann ich diese Szene spannender machen?“)"></textarea>
        <button class="btn primary" id="chatSend">Senden</button>
      </div>
    </div></div>`;
  const scroll=m.querySelector("#chatScroll");
  const renderChat=()=>{
    if(CHAT.length===0){
      scroll.innerHTML=`<div class="msg assistant"><div class="who">✨</div><div class="bubble">Hallo! Ich bin dein Schreib-Coach. Ich sehe, woran du gerade arbeitest, und helfe dir gern weiter – beim Ideenfinden, beim Vertiefen von Figuren oder mit ehrlichem Feedback. Womit fangen wir an? Nutze gern die Vorschläge unten.</div></div>`;
    } else {
      scroll.innerHTML=CHAT.map(msg=>`<div class="msg ${msg.role}">
        <div class="who">${msg.role==="user"?"🖊️":"✨"}</div>
        <div class="bubble ${msg.pending?'typing':''}">${esc(msg.content)}</div></div>`).join("");
    }
    scroll.scrollTop=scroll.scrollHeight;
  };
  renderChat();
  const quick=[
    {t:"Feedback zu dieser Szene", m:"Gib mir kurzes, konkretes Feedback zu meiner aktuellen Szene: Was funktioniert, was könnte ich verbessern?"},
    {t:"Wie geht es weiter?", m:"Ich stecke fest. Schlag mir 3 mögliche Fortsetzungen für die Geschichte vor – als kurze Denkanstöße, nicht ausformuliert."},
    {t:"Figur vertiefen", m:"Hilf mir, meine Hauptfigur greifbarer zu machen. Stell mir 3–4 gute Fragen zu ihr."},
    {t:"Idee entwickeln", m:"Aus meiner Prämisse: Welche interessante Frage könnte meine Geschichte stellen? Denk laut mit mir."},
  ];
  m.querySelector("#quickRow").innerHTML=quick.map((q,i)=>`<button class="quick" data-q="${i}">${q.t}</button>`).join("");
  m.querySelectorAll(".quick").forEach(b=>b.onclick=()=>sendToAI(quick[+b.dataset.q].m));
  const ta=m.querySelector("#chatInput");
  const send=()=>{ const t=ta.value.trim(); if(t){ ta.value=""; sendToAI(t); } };
  m.querySelector("#chatSend").onclick=send;
  ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } };
  m.querySelector("#aiClear").onclick=()=>{ CHAT=[]; renderChat(); };
  m.querySelector("#aiSettings").onclick=()=>{ ai.key=""; save(); VIEWS.assistant(); };

  async function sendToAI(userText){
    CHAT.push({role:"user", content:userText});
    CHAT.push({role:"assistant", content:"denkt nach …", pending:true});
    renderChat();
    try{
      const reply=await callClaude(userText);
      CHAT.pop();
      CHAT.push({role:"assistant", content:reply});
    }catch(err){
      CHAT.pop();
      CHAT.push({role:"assistant", content:"⚠️ "+(err.message||"Da ist etwas schiefgelaufen.")});
    }
    renderChat();
  }
};
function buildContext(){
  const p=proj(); const parts=[];
  parts.push(`Titel des Projekts: ${p.meta.title}`);
  if(p.meta.genre) parts.push(`Genre: ${p.meta.genre}`);
  if(p.meta.logline) parts.push(`Logline: ${p.meta.logline}`);
  if(p.meta.premise) parts.push(`Prämisse: ${p.meta.premise}`);
  if(p.characters.length) parts.push("Figuren: "+p.characters.map(c=>c.name+(c.role?` (${c.role})`:"")+(c.goal?` – will: ${c.goal}`:"")).join("; "));
  if(p.places.length) parts.push("Orte: "+p.places.map(pl=>pl.name).join(", "));
  // aktuelle Szene
  if(EDIT_SCENE){
    const ch=p.chapters.find(c=>c.id===EDIT_SCENE.chapterId);
    const sc=ch&&ch.scenes.find(s=>s.id===EDIT_SCENE.sceneId);
    if(sc){ parts.push(`\nAktuelle Szene „${sc.title||"ohne Titel"}"`+(sc.summary?` (${sc.summary})`:"")+":\n"+(sc.text||"(noch leer)").slice(0,3000)); }
  }
  return parts.join("\n");
}
async function callClaude(userText){
  const ai=aiState();
  const system=`Du bist ein warmherziger, ermutigender Schreib-Coach für absolute Anfängerinnen und Anfänger. Du hilfst beim Lernen des Handwerks und beim Entwickeln von Geschichten. Antworte auf Deutsch, kurz und konkret. Stelle gute Rückfragen, gib umsetzbare Hinweise und Beispiele. Schreibe die Geschichte NICHT für die Person – hilf ihr, es selbst zu tun, außer sie bittet ausdrücklich um einen Textvorschlag. Beziehe dich, wo sinnvoll, auf den folgenden Kontext ihres aktuellen Projekts:\n\n`+buildContext();
  const messages=CHAT.filter(x=>!x.pending).map(x=>({role:x.role, content:x.content}));
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":ai.key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({ model:ai.model, max_tokens:1200, system, messages })
  });
  if(!res.ok){
    let msg="Fehler "+res.status;
    try{ const e=await res.json(); if(e.error&&e.error.message) msg=e.error.message; }catch(_){}
    if(res.status===401) msg="Der API-Schlüssel wird nicht akzeptiert. Bitte in den Einstellungen prüfen.";
    if(res.status===429) msg="Zu viele Anfragen oder Guthaben aufgebraucht. Bitte später erneut versuchen.";
    throw new Error(msg);
  }
  const data=await res.json();
  if(data.stop_reason==="refusal") return "Zu dieser Anfrage kann ich leider nichts sagen. Formulier sie gern anders.";
  const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  return txt||"(keine Antwort erhalten)";
}

/* ============================================================
   Modal-System
   ============================================================ */
function modal(html, onSave, afterMount, noSaveBtn){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal ${html.length>1400?'wide':''}">
    <div id="mBody">${html}</div>
    <div class="foot">
      ${noSaveBtn?"":`<button class="btn ghost" id="mCancel">Abbrechen</button><button class="btn primary" id="mSave">Speichern</button>`}
    </div></div></div>`;
  const ov=root.querySelector("#ov");
  ov.onclick=e=>{ if(e.target===ov) closeModal(); };
  if(!noSaveBtn){
    root.querySelector("#mCancel").onclick=closeModal;
    root.querySelector("#mSave").onclick=()=>{ if(onSave){ const r=onSave(); if(r===false) return; } closeModal(); };
  }
  const modalEl=root.querySelector(".modal");
  if(afterMount) afterMount(modalEl);
  const first=root.querySelector("input,textarea,select"); if(first) first.focus();
  document.onkeydown=e=>{ if(e.key==="Escape") closeModal(); };
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; document.onkeydown=null; }
window.closeModal=closeModal;
function val(id){ const el=document.getElementById(id); return el?el.value.trim():""; }
function mount(){ const m=document.getElementById("main"); m.innerHTML='<div class="view"></div>'; return m.querySelector(".view"); }

/* ---------- Utilities ---------- */
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }
function autoGrow(ta){
  const grow=()=>{ ta.style.height="auto"; ta.style.height=Math.max(ta.scrollHeight, window.innerHeight*0.55)+"px"; };
  ta.addEventListener("input",grow); setTimeout(grow,0);
}

document.getElementById("btnExport").onclick=()=>{
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="federwerk-sicherung.json"; a.click();
  toast("Sicherung heruntergeladen.");
};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(d.projects&&d.current){ DB=d; save(); go("dashboard"); toast("Sicherung geladen."); }
    else if(d.id&&d.meta){ DB.projects[d.id]=d; DB.current=d.id; save(); go("dashboard"); toast("Projekt importiert."); }
    else toast("Datei nicht erkannt.");
  }catch(err){ toast("Datei konnte nicht gelesen werden."); } };
  r.readAsText(f); e.target.value="";
};
document.getElementById("btnTheme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("federwerk.theme",next); }catch(e){}
};
(function initTheme(){ try{ const t=localStorage.getItem("federwerk.theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){} })();
